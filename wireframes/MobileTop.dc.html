<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-bottom:1px solid #2b2f34;background:#191b1e">
<sc-if value="{{back}}" hint-placeholder-val="{{ true }}"><div style="width:32px;height:32px;margin-left:-8px;display:flex;align-items:center;justify-content:center;font:400 22px/1 Helvetica,Arial,sans-serif;color:#8b9196">&#8249;</div></sc-if>
<span style="font:600 14px/1.2 Helvetica,Arial,sans-serif;color:#e6e8ea;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ title }}</span>
<div style="display:flex;align-items:center;gap:5px;flex:none">
<div style="width:7px;height:7px;border-radius:4px;background:{{ dot }}"></div>
<span style="font:400 10px/1 ui-monospace,Menlo,monospace;color:#8b9196;letter-spacing:.02em">{{ lab }}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:48},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Browse&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;back&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sse&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;down&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const down = this.props.sse === 'down';
    return { dot: down ? '#c9605a' : '#5aa06f', lab: down ? 'reconnecting' : 'live' };
  }
}
</script>
</body>
</html>
