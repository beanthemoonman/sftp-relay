services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # arm64 for the Pi. Set TARGETARCH=amd64 to build a runnable image on a PC.
      args:
        TARGETARCH: ${TARGETARCH:-arm64}
    image: sftp-relay:latest
    container_name: sftp-relay
    restart: unless-stopped
    ports:
      - "8088:80"
    env_file: .env
    volumes:
      - relay-data:/data
      - ${NAS_SSH_KEY_PATH_HOST:-./nas_key}:/keys/nas_key:ro

volumes:
  relay-data:
